<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}விலைத் தோழி · VilaiThozhi{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="40" height="40">
        <span><b data-i18n="brand">விலைத் தோழி</b><small data-i18n="tagline"></small></span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('home') }}" class="{{ 'active' if page == 'home' }}" data-i18n="nav_home"></a>
        <a href="{{ url_for('calculator') }}" class="{{ 'active' if page == 'calc' }}" data-i18n="nav_calc"></a>
        <a href="{{ url_for('products_page') }}" class="{{ 'active' if page == 'products' }}" data-i18n="nav_products"></a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="ta">தமிழ்</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="container">
      <span data-i18n="footer"></span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
